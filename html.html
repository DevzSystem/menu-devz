<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=ai-legible&utm_source=comment&utm_medium=referral&utm_id=46102bcb-5c20-41c6-a982-9a1da2b9ed09
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
		<meta name="hosting-provider" content="Netlify" />
		<meta
			name="netlify-deploy"
			content="https://netlify.new/?utm_campaign=ai-legible&amp;utm_source=meta&amp;utm_medium=referral&amp;utm_id=46102bcb-5c20-41c6-a982-9a1da2b9ed09"
		/>
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		/>
		<title>DEVZ - Mobile Platform</title>
		<script src="https://cdn.tailwindcss.com"></script>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Iceberg&display=swap"
			rel="stylesheet"
		/>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
		/>

		<style>
			body {
			    font-family: 'Iceberg', cursive, sans-serif;
			    background-color: #000000;
			    -webkit-tap-highlight-color: transparent;
			    overflow: hidden;
			    position: fixed;
			    width: 100%;
			    height: 100%;
			    -webkit-app-region: drag; /* Permite arrastar no H5GG */
			}
			input, button, a, .switch-label, .overflow-y-auto {
			    -webkit-app-region: no-drag;
			}
			.custom-input:focus {
			    box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
			}
			.switch-checkbox:checked + .switch-label {
			    background-color: #ffffff;
			}
			.switch-checkbox:checked + .switch-label .switch-ball {
			    transform: translateX(16px);
			    background-color: #000000;
			}
			::-webkit-scrollbar {
			    width: 0px;
			}
			.mobile-container {
			    max-width: 480px;
			    width: 100%;
			    margin: 0 auto;
			    height: 100%;
			}
		</style>
	</head>
	<body class="text-white antialiased select-none">
		<div
			class="mobile-container w-full h-full flex flex-col justify-between p-6"
		>
			<div id="loginScreen" class="flex flex-col h-full justify-between">
				<header class="flex justify-center pt-8">
					<div class="flex items-center gap-2">
						<svg
							class="w-8 h-8 text-white"
							fill="none"
							stroke="currentColor"
							viewBox="0 0 24 24"
							xmlns="http://www.w3.org/2000/svg"
						>
							<path
								stroke-linecap="round"
								stroke-linejoin="round"
								stroke-width="1.5"
								d="M12 2L2 22h20L12 2zM12 6l6.5 13H5.5L12 6z"
							></path>
						</svg>
						<span
							class="text-2xl tracking-widest text-white uppercase font-bold"
							>DEVZ OS</span
						>
					</div>
				</header>

				<main class="w-full flex flex-col justify-center my-auto">
					<div class="mb-10 text-center">
						<h1
							class="text-3xl font-normal uppercase tracking-wide text-white mb-2"
						>
							Acessar Devz OS
						</h1>
						<p class="text-xs text-neutral-500 tracking-wider">
							Insira sua chave de acesso para continuar
						</p>
					</div>

					<form
						id="loginForm"
						class="space-y-6"
						onsubmit="handleLogin(event)"
					>
						<div class="relative flex flex-col space-y-2">
							<label
								for="accessKey"
								class="text-xs uppercase tracking-widest text-neutral-400 pl-1"
								>Chave de Acesso</label
							>
							<input
								type="text"
								id="accessKey"
								required
								placeholder="XXXX-XXXX-XXX-XXX"
								class="custom-input w-full bg-black text-white text-center text-lg px-4 py-4 rounded-xl border border-neutral-800 focus:border-white focus:outline-none transition-all duration-300 placeholder-neutral-700 tracking-widest uppercase"
							/>
						</div>

						<button
							type="submit"
							class="w-full bg-white text-black text-sm uppercase font-bold tracking-widest py-4 rounded-xl hover:bg-neutral-200 active:scale-[0.98] transition-all duration-200 mt-4"
						>
							Entrar
						</button>
					</form>

					<div
						class="w-full flex justify-center mt-6 text-xs text-neutral-500 tracking-wider px-1"
					>
						<a
							href="https://wa.me/5563992726620"
							target="_blank"
							class="hover:text-white underline transition-colors duration-200"
							>Adquirir Keys</a
						>
					</div>
				</main>

				<footer
					class="pb-2 text-center text-[10px] text-neutral-700 tracking-widest"
				>
					&copy; 2026 DEVZ. ALL RIGHTS RESERVED.
				</footer>
			</div>

			<div
				id="mainMenuScreen"
				class="hidden flex flex-col h-full justify-between"
			>
				<div>
					<header class="flex justify-between items-center pt-2 pb-4">
						<div class="flex items-center gap-2">
							<svg
								class="w-6 h-6 text-white"
								fill="none"
								stroke="currentColor"
								viewBox="0 0 24 24"
								xmlns="http://www.w3.org/2000/svg"
							>
								<path
									stroke-linecap="round"
									stroke-linejoin="round"
									stroke-width="1.5"
									d="M12 2L2 22h20L12 2zM12 6l6.5 13H5.5L12 6z"
								></path>
							</svg>
							<span
								class="text-xl tracking-widest font-bold uppercase"
								>DEVZ</span
							>
						</div>
						<button
							onclick="minimizeMenu()"
							class="text-neutral-500 hover:text-white"
						>
							<i class="fa-solid fa-compress"></i>
						</button>
					</header>

					<hr class="border-neutral-800 my-1" />

					<nav class="flex justify-between py-2">
						<button
							onclick="switchTab(1)"
							id="tab1"
							class="w-1/3 text-center text-xs uppercase tracking-widest py-2 border-b-2 border-white text-white transition-all duration-200"
						>
							Mira
						</button>
						<button
							onclick="switchTab(2)"
							id="tab2"
							class="w-1/3 text-center text-xs uppercase tracking-widest py-2 border-b-2 border-transparent text-neutral-500 hover:text-neutral-300 transition-all duration-200"
						>
							Otimizar
						</button>
						<button
							onclick="switchTab(3)"
							id="tab3"
							class="w-1/3 text-center text-xs uppercase tracking-widest py-2 border-b-2 border-transparent text-neutral-500 hover:text-neutral-300 transition-all duration-200"
						>
							Info
						</button>
					</nav>

					<hr class="border-neutral-800 my-1" />
				</div>

				<main
					id="functionsContainer"
					class="flex-1 py-4 space-y-3 overflow-y-auto max-h-[calc(100vh-180px)] pr-1"
				></main>
			</div>
		</div>

		<script>
			// ==========================================
			// 1. DETECÇÃO DE PLATAFORMA
			// ==========================================
			const isIOS = typeof h5gg !== 'undefined';
			const isAndroid = typeof Android !== 'undefined'; // Pressupõe injeção via JavascriptInterface no Android

			if (isIOS) {
			    setWindowRect(60, 60, 350, 600); // Tamanho da janela no H5GG
			    setWindowDrag(0, 0, 350, 80);    // Área que pode ser arrastada
			}

			function minimizeMenu() {
			    if (isIOS) {
			        closeMenu(); // Minimiza no iOS
			    } else if (isAndroid && typeof Android.closeMenu === 'function') {
			        Android.closeMenu(); // Minimiza no Android
			    } else {
			        alert("Apenas no injetor.");
			    }
			}

			// ==========================================
			// 2. SISTEMA IOS (H5GG COMPLETO)
			// ==========================================
			const iOS_Engine = {
			    patch: function(search, replace, type) {
			        if (!isIOS) return;
			        try {
			            h5gg.clearResults();
			            // Tipos comuns: 'I32' (Dword), 'F32' (Float), 'I16' (Word)
			            h5gg.searchNumber(search, type, '0x00000000', '0x200000000');
			            h5gg.editAll(replace, type);
			            h5gg.clearResults();
			            console.log(`[H5GG] Aplicado: ${search} -> ${replace} (${type})`);
			        } catch (e) {
			            console.error("[H5GG] Erro ao aplicar memória: ", e);
			        }
			    },

			    // FUNÇÕES ESPECÍFICAS IOS
			    mira_1: { // Aimbot
			        on: () => iOS_Engine.patch('1084227584', '1092616192', 'I32'), // COLOQUE SEUS VALORES REAIS AQUI
			        off: () => iOS_Engine.patch('1092616192', '1084227584', 'I32')
			    },
			    mira_2: { // Aimlock
			        on: () => iOS_Engine.patch('0.5', '1.0', 'F32'),
			        off: () => iOS_Engine.patch('1.0', '0.5', 'F32')
			    },
			    mira_3: { // Precision
			        on: () => iOS_Engine.patch('1', '100', 'I32'),
			        off: () => iOS_Engine.patch('100', '1', 'I32')
			    },
			    mira_4: { // No Recoil
			        on: () => iOS_Engine.patch('1.0', '0.0', 'F32'),
			        off: () => iOS_Engine.patch('0.0', '1.0', 'F32')
			    },
			    mira_5: { // Aim-Fov 360°
			        on: () => iOS_Engine.patch('60.0', '360.0', 'F32'),
			        off: () => iOS_Engine.patch('360.0', '60.0', 'F32')
			    },
			    mira_6: { // Regedit Mobile
			        on: () => iOS_Engine.patch('450', '999', 'I32'),
			        off: () => iOS_Engine.patch('999', '450', 'I32')
			    },
			    otm_1: { // 240 Hz
			        on: () => iOS_Engine.patch('60', '240', 'I32'),
			        off: () => iOS_Engine.patch('240', '60', 'I32')
			    },
			    otm_2: { // Touch Enhancer
			        on: () => iOS_Engine.patch('50', '100', 'I32'),
			        off: () => iOS_Engine.patch('100', '50', 'I32')
			    },
			    otm_3: { // - Input Lag
			        on: () => iOS_Engine.patch('0.05', '0.00', 'F32'),
			        off: () => iOS_Engine.patch('0.00', '0.05', 'F32')
			    },
			    otm_4: { // FPS Stabilizer
			        on: () => iOS_Engine.patch('0', '1', 'I32'),
			        off: () => iOS_Engine.patch('1', '0', 'I32')
			    },
			    otm_5: { // Fast Touch
			        on: () => iOS_Engine.patch('0.15', '7.0', 'F32'),
			        off: () => iOS_Engine.patch('7.0', '0.15', 'F32')
			    },
			    otm_6: { // Touch Precision
			        on: () => iOS_Engine.patch('50', '100', 'I32'),
			        off: () => iOS_Engine.patch('100', '50', 'I32')
			    }
			};

			// ==========================================
			// 3. SISTEMA ANDROID (GAME GUARDIAN / C++ BRIDGE)
			// ==========================================
			const Android_Engine = {
			    patch: function(search, replace, type) {
			        if (!isAndroid) return;
			        try {
			            // A função 'editMemory' deve ser declarada no código C++/Java do seu injetor Android
			            if(typeof Android.editMemory === 'function') {
			                Android.editMemory(search, replace, type);
			            } else if (typeof Android.MemoryPatch === 'function') {
			                Android.MemoryPatch(search, replace, type);
			            }
			            console.log(`[ANDROID] Aplicado: ${search} -> ${replace} (${type})`);
			        } catch (e) {
			            console.error("[ANDROID] Erro ao aplicar memória: ", e);
			        }
			    },

			    // FUNÇÕES ESPECÍFICAS ANDROID (Podem ter offsets diferentes do iOS)
			    mira_1: { // Aimbot
			        on: () => Android_Engine.patch('1084227584', '1092616192', 'Dword'), // No Android geralmente usa-se a string 'Dword' ou 'Float'
			        off: () => Android_Engine.patch('1092616192', '1084227584', 'Dword')
			    },
			    mira_2: { // Aimlock
			        on: () => Android_Engine.patch('0.5', '1.0', 'Float'),
			        off: () => Android_Engine.patch('1.0', '0.5', 'Float')
			    },
			    mira_3: { // Precision
			        on: () => Android_Engine.patch('1', '100', 'Dword'),
			        off: () => Android_Engine.patch('100', '1', 'Dword')
			    },
			    mira_4: { // No Recoil
			        on: () => Android_Engine.patch('1.0', '0.0', 'Float'),
			        off: () => Android_Engine.patch('0.0', '1.0', 'Float')
			    },
			    mira_5: { // Aim-Fov 360°
			        on: () => Android_Engine.patch('60.0', '360.0', 'Float'),
			        off: () => Android_Engine.patch('360.0', '60.0', 'Float')
			    },
			    mira_6: { // Regedit Mobile
			        on: () => Android_Engine.patch('450', '999', 'Dword'),
			        off: () => Android_Engine.patch('999', '450', 'Dword')
			    },
			    otm_1: { // 240 Hz
			        on: () => Android_Engine.patch('60', '240', 'Dword'),
			        off: () => Android_Engine.patch('240', '60', 'Dword')
			    },
			    otm_2: { // Touch Enhancer
			        on: () => Android_Engine.patch('100', '999', 'Dword'),
			        off: () => Android_Engine.patch('999', '100', 'Dword')
			    },
			    otm_3: { // - Input Lag
			        on: () => Android_Engine.patch('0.05', '0.00', 'Float'),
			        off: () => Android_Engine.patch('0.00', '0.05', 'Float')
			    },
			    otm_4: { // FPS Stabilizer
			        on: () => Android_Engine.patch('0', '1', 'Dword'),
			        off: () => Android_Engine.patch('1', '0', 'Dword')
			    },
			    otm_5: { // Fast Touch
			        on: () => Android_Engine.patch('0.15', '7.0', 'Float'),
			        off: () => Android_Engine.patch('7.0', '0.15', 'Float')
			    },
			    otm_6: { // Touch Precision
			        on: () => Android_Engine.patch('50', '100', 'Dword'),
			        off: () => Android_Engine.patch('100', '50', 'Dword')
			    }
			};

			// ==========================================
			// 4. LÓGICA DE INTERFACE E LOGIN
			// ==========================================
			const keyInput = document.getElementById('accessKey');
			const loginScreen = document.getElementById('loginScreen');
			const mainMenuScreen = document.getElementById('mainMenuScreen');

			const validKeys = [
			    "DEVZ2K26ZKX777", "DEVZ2K26ZKX111", "DEVZ2K26ZKX222",
			    "DEVZ2K26ZKX333", "DEVZ2K26ZKX444", "DEVZ2K26ZKX555", "DEVZ2K26ZKX666"
			];

			keyInput.addEventListener('input', (e) => {
			    let cleanValue = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
			    if (cleanValue.length > 14) cleanValue = cleanValue.slice(0, 14);

			    let formatted = cleanValue;
			    if (cleanValue.length > 4 && cleanValue.length <= 8) {
			        formatted = `${cleanValue.slice(0, 4)}-${cleanValue.slice(4)}`;
			    } else if (cleanValue.length > 8 && cleanValue.length <= 11) {
			        formatted = `${cleanValue.slice(0, 4)}-${cleanValue.slice(4, 8)}-${cleanValue.slice(8)}`;
			    } else if (cleanValue.length > 11) {
			        formatted = `${cleanValue.slice(0, 4)}-${cleanValue.slice(4, 8)}-${cleanValue.slice(8, 11)}-${cleanValue.slice(11)}`;
			    }
			    e.target.value = formatted;
			});

			function handleLogin(event) {
			    event.preventDefault();
			    const keyValueClean = keyInput.value.replace(/[^A-Z0-9]/g, '').trim().toUpperCase();

			    if (!validKeys.includes(keyValueClean)) {
			        alert("Acesso Negado: Chave de acesso inválida ou expirada.");
			        return;
			    }

			    const submitBtn = event.target.querySelector('button[type="submit"]');
			    submitBtn.innerText = "Autenticando...";
			    submitBtn.disabled = true;

			    setTimeout(() => {
			        loginScreen.classList.add('hidden');
			        mainMenuScreen.classList.remove('hidden');
			        renderFunctions(1);
			    }, 1000);
			}

			const tabsData = {
			    1: [
			        { id: "mira_1", name: "Aimbot", desc: "Puxa a mira semi automático para a cabeça do inimigo mais próximo com zero atraso.", icon: "fa-solid fa-crosshairs" },
			        { id: "mira_2", name: "Aimlock", desc: "Trava a mira na cabeça do adversário de forma semi fixa, impedindo que ela escape.", icon: "fa-solid fa-bullseye" },
			        { id: "mira_6", name: "Regedit Mobile", desc: "Combinação equilibrada entre assistência de mira automática e travamento de alvo.", icon: "fa-solid fa-hand-back-fist" },
			        { id: "mira_5", name: "Aim-Fov 360°", desc: "Amplia o campo de busca do Aimbot para um ângulo de 360° à sua frente.", icon: "fa-solid fa-eye" },
			        { id: "mira_4", name: "No Recoil", desc: "Reduz drasticamente o coice da arma, mantendo as rajadas de tiros centralizadas.", icon: "fa-solid fa-arrows-to-dot" },
			        { id: "mira_3", name: "Precision", desc: "Aumenta a precisão com foco na cabeça de forma suave, ideal para um estilo de jogo mais legítimo.", icon: "fa-solid fa-location-crosshairs" }
			    ],
			    2: [
			        { id: "otm_1", name: "240 Hz", desc: "Força a taxa de atualização do aparelho para  240Hz, buscando a máxima fluidez no jogo.", icon: "fa-solid fa-gauge-high" },
			        { id: "otm_2", name: "Touch Enhancer", desc: "Otimiza a sensibilidade do display para reconhecer até os menores movimentos.", icon: "fa-solid fa-microchip" },
			        { id: "otm_3", name: "- Input Lag", desc: "Reduz o tempo de resposta do sistema para que cada comando seja executado instantaneamente.", icon: "fa-solid fa-bolt" },
			        { id: "otm_4", name: "FPS Stabilizer", desc: "Estabiliza a taxa de quadros por segundo, evitando quedas bruscas de desempenho durante a partida.", icon: "fa-solid fa-rocket" },
			        { id: "otm_5", name: "Fast Touch", desc: "Minimiza o atraso de ativação do clique na tela para reações ultrarrápidas.", icon: "fa-solid fa-eraser" },
			        { id: "otm_6", name: "Touch Precision", desc: "Refina o rastreamento dos dedos na tela, garantindo alta precisão no posicionamento.", icon: "fa-solid fa-trash-can" }
			    ]
			};

			const switchStates = {};

			function renderFunctions(tabNumber) {
			    const container = document.getElementById('functionsContainer');
			    container.innerHTML = '';

			    if (tabNumber === 3) {
			        container.innerHTML = `
			            <div class="space-y-3 font-sans text-xs tracking-wider">
			                <div class="bg-neutral-950 border border-neutral-900 rounded-xl p-4 flex justify-between items-center">
			                    <span class="text-neutral-400 font-mono">STATUS</span>
			                    <span class="text-emerald-500 font-bold uppercase flex items-center gap-1.5">
			                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ONLINE
			                    </span>
			                </div>
			                <div class="bg-neutral-950 border border-neutral-900 rounded-xl p-4 flex justify-between items-center">
			                    <span class="text-neutral-400 font-mono">PLATAFORMA ATIVA</span>
			                    <span class="text-white uppercase font-mono font-bold">${isIOS ? 'iOS (H5GG)' : isAndroid ? 'ANDROID' : 'WEB TEST'}</span>
			                </div>
			                <div class="bg-neutral-950 border border-neutral-900 rounded-xl p-4 flex justify-between items-center">
			                    <span class="text-neutral-400 font-mono">LOGIN ACCESS</span>
			                    <span class="text-white uppercase font-mono">${keyInput.value.slice(0,5)}*******</span>
			                </div>
			                <div class="bg-neutral-950 border border-neutral-900 rounded-xl p-4 flex justify-between items-center">
			                    <span class="text-neutral-400 font-mono">TEMPO DE LOGIN</span>
			                    <span id="sessionTimer" class="text-white font-mono font-bold">00:00</span>
			                </div>
			                <div class="bg-neutral-950 border border-neutral-900 rounded-xl p-4 flex flex-col gap-2">
			                    <span class="text-neutral-400 font-mono">REDES SOCIAIS</span>
			                    <div class="flex flex-col gap-2 pt-1">
			                        <a href="https://www.instagram.com/devssystem" target="_blank" class="text-white font-bold hover:text-neutral-300 flex items-center gap-2">
			                            <i class="fa-brands fa-instagram text-lg"></i> @devssystem
			                        </a>
			                    </div>
			                </div>
			                <div class="pt-4 text-center text-[10px] text-neutral-600 tracking-widest uppercase">
			                    &copy; 2026 DEVZ PLATFORM.<br> ALL RIGHTS RESERVED.
			                </div>
			            </div>
			        `;
			        startTimer();
			        return;
			    }

			    const functions = tabsData[tabNumber];

			    functions.forEach(func => {
			        if (switchStates[func.id] === undefined) switchStates[func.id] = false;
			        const isChecked = switchStates[func.id] ? 'checked' : '';

			        const row = document.createElement('div');
			        row.className = "flex items-center justify-between bg-neutral-950 border border-neutral-900 rounded-xl p-3.5 gap-3";

			        row.innerHTML = `
			            <div class="flex items-start gap-4 flex-1">
			                <div class="w-11 h-11 bg-neutral-900 border border-neutral-800 rounded-xl flex items-center justify-center text-white text-base shrink-0 mt-0.5">
			                    <i class="${func.icon}"></i>
			                </div>
			                <div class="flex flex-col gap-1 pr-2">
			                    <span class="text-xs uppercase tracking-wider text-neutral-200 font-bold">${func.name}</span>
			                    <span class="text-[9px] text-neutral-500 font-sans tracking-wide leading-relaxed">${func.desc}</span>
			                </div>
			            </div>
			            <div class="relative inline-block w-10 mr-1 align-middle select-none shrink-0">
			                <input type="checkbox" name="${func.id}" id="${func.id}" ${isChecked} onchange="toggleSwitch('${func.id}')" class="switch-checkbox absolute block w-0 h-0 opacity-0"/>
			                <label for="${func.id}" class="switch-label block overflow-hidden h-6 rounded-full bg-neutral-800 border border-neutral-700 cursor-pointer transition-colors duration-200">
			                    <span class="switch-ball block w-4 h-4 rounded-full bg-neutral-400 absolute top-1 left-1 transition-transform duration-200"></span>
			                </label>
			            </div>
			        `;
			        container.appendChild(row);
			    });
			}

			function switchTab(tabNumber) {
			    for (let i = 1; i <= 3; i++) {
			        const tab = document.getElementById(`tab${i}`);
			        tab.classList.remove('border-white', 'text-white');
			        tab.classList.add('border-transparent', 'text-neutral-500');
			    }
			    const activeTab = document.getElementById(`tab${tabNumber}`);
			    activeTab.classList.remove('border-transparent', 'text-neutral-500');
			    activeTab.classList.add('border-white', 'text-white');

			    renderFunctions(tabNumber);
			}

			// ==========================================
			// 5. ATIVADOR DE FUNÇÕES (ROTEADOR)
			// ==========================================
			function toggleSwitch(id) {
			    const checkbox = document.getElementById(id);
			    const isEnabled = checkbox.checked;
			    switchStates[id] = isEnabled;

			    // Roteia a injeção baseada no dispositivo atual
			    try {
			        if (isIOS) {
			            isEnabled ? iOS_Engine[id].on() : iOS_Engine[id].off();
			        } else if (isAndroid) {
			            isEnabled ? Android_Engine[id].on() : Android_Engine[id].off();
			        } else {
			            // Feedback visual se abrir no navegador normal do PC/Celular
			            console.log(`[TEST MODE] A função ${id} foi ${isEnabled ? 'LIGADA' : 'DESLIGADA'}.`);
			        }
			    } catch (error) {
			        console.error("Erro na injeção: ", error);
			    }
			}

			let secondsElapsed = 0;
			let timerInterval = null;

			function startTimer() {
			    if (timerInterval) clearInterval(timerInterval);
			    timerInterval = setInterval(() => {
			        secondsElapsed++;
			        const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
			        const secs = String(secondsElapsed % 60).padStart(2, '0');
			        const timerElement = document.getElementById('sessionTimer');
			        if (timerElement) timerElement.innerText = `${mins}:${secs}`;
			    }, 1000);
			}
		</script>
	</body>
</html>
